name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: The network regenerates identically
        run: |
          python tools/make_network.py
          git diff --exit-code data/
      - name: Route end to end
        run: |
          routeplanner stats
          routeplanner route   n0202 n3737
          routeplanner route   n0202 n3737 --fastest
          routeplanner compare n0202 n3737
          routeplanner weights -p 40
          routeplanner bench   -p 60
          routeplanner nearest 31.45 74.25
